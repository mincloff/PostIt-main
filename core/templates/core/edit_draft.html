<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Draft - PostIt Ultra AI</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tinymce/6.8.3/tinymce.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 40px;
        }

        .card {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .meta-info {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e5e7eb;
            color: #6b7280;
            font-size: 14px;
        }

        .btn-save {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-top: 20px;
        }

        .btn-cancel {
            background: white;
            color: #6b7280;
            border: 1px solid #d1d5db;
            padding: 11px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            text-decoration: none;
            margin-left: 10px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2 style="margin-top: 0;">Edit Your Draft</h2>

        <div class="meta-info">
            <strong>Original Prompt:</strong> "{{ post.original_prompt }}"<br>
            <span style="display: inline-block; margin-top: 5px;"><strong>Target Platforms:</strong>
                {{post.target_platforms }}</span>
        </div>

        <form method="POST">
            {% csrf_token %}
            <textarea name="generated_text" id="editor">{{ post.generated_text|safe }}</textarea>
            <div
                style="margin-top: 20px; background: #f9fafb; padding: 15px; border-radius: 8px; border: 1px solid #e5e7eb;">
                <label style="font-weight: bold; color: #4b5563; display: block; margin-bottom: 8px;">🕒 Schedule this
                    post (Optional)</label>
                <input type="datetime-local" name="scheduled_time" value="{{ post.scheduled_time|date:'Y-m-d\TH:i' }}"
                    style="padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-family: inherit; width: 100%; max-width: 300px;">
                <p style="margin: 5px 0 0 0; color: #6b7280; font-size: 12px;">Leave blank to save as a regular draft.
                </p>
            </div>
            <div style="display: flex; align-items: center;">
                <button type="submit" class="btn-save">Save Changes</button>
                <a href="{% url 'drafts' %}" class="btn-cancel" style="margin-top: 20px;">Cancel</a>
            </div>
        </form>
    </div>

    <script>
        tinymce.init({
            selector: '#editor',
            menubar: false,
            statusbar: false, /* <-- ADD THIS LINE to hide the little p! */
            plugins: 'lists link emoticons',
            toolbar: 'undo redo | bold italic | alignleft aligncenter alignright | bullist numlist | emoticons',
            branding: false,
            height: 400,
            content_style: "body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 15px; color: #1f2937; }"
        });
    </script>

</body>

</html>
